<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eee6" />
    <!-- Apply the saved theme / mode before first paint (no light flash in dark mode). Mirrors src/theme.ts -->
    <script>
      try {
        var t = localStorage.getItem('ggmv_theme');
        var m = localStorage.getItem('ggmv_mode') || 'system';
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (t && t !== 'auto') document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = d ? 'dark' : 'light';
        // A pinned seasonal world (not "auto": its calendar lives in src/seasons/worlds.ts)
        var w = localStorage.getItem('ggmv_world');
        if (w && w !== 'off' && w !== 'auto') document.documentElement.dataset.world = w;
        if (localStorage.getItem('ggmv_symmetry') === 'on') document.documentElement.dataset.symmetry = 'on';
      } catch (e) {}
    </script>
    <title>GAY GANG CINEMA - Hôm nay xem gì?</title>
    <meta name="description" content="Câu lạc bộ chiếu phim của hội: bỏ phim vào kho, cả hội vote, vòng quay chốt phim cuối tuần, bảng vàng lưu lại mọi suất chiếu." />
